<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hyperliquid Korea Arbitrage Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Hyperliquid 🇰🇷 Arbitrage Dashboard</h1>
      <div class="meta">
        <span id="fxRate">USD/KRW: -</span>
        <span id="updatedAt">업데이트: -</span>
      </div>
    </header>

    <main>
      <section class="grid" id="assetGrid"></section>
    </main>

    <template id="assetCardTemplate">
      <article class="card">
        <h2 class="symbol"></h2>
        <p class="sub"></p>

        <div class="rows">
          <div class="row">
            <span>국내 주식 가격</span>
            <strong class="krxPrice">-</strong>
          </div>
          <div class="row">
            <span>하이퍼리퀴드 가격</span>
            <strong class="hlPrice">-</strong>
          </div>
          <div class="row small">
            <span>USD 기준</span>
            <span class="hlUsd">-</span>
          </div>
          <div class="row">
            <span>GAP</span>
            <strong class="gap">-</strong>
          </div>
          <div class="row small">
            <span>Funding (1h / APR)</span>
            <span class="funding">-</span>
          </div>
        </div>

        <div class="bookWrap">
          <h3>호가창 Top 5</h3>
          <div class="books">
            <div>
              <p class="label ask">ASK</p>
              <ul class="asks"></ul>
            </div>
            <div>
              <p class="label bid">BID</p>
              <ul class="bids"></ul>
            </div>
          </div>
        </div>
      </article>
    </template>

    <script type="module" src="script.js"></script>
  </body>
</html>
